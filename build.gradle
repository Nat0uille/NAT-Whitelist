plugins {
    id 'java'
}

group = "fr.Nat0uille"

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    // Downloaded by Paper at runtime via plugin.yml libraries
    compileOnly 'com.h2database:h2:2.4.240'
    compileOnly 'com.mysql:mysql-connector-j:9.7.0'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.9'
    compileOnly 'com.zaxxer:HikariCP:7.0.2'

    compileOnly("io.papermc.paper:paper-api:26.2-rc-2.build.9-alpha")
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    destinationDirectory = file("$rootDir/jar")
    archiveFileName = "${rootProject.name}-${version}.jar"
}

tasks.register('cleanJar', Delete) {
    delete file("$rootDir/jar")
}

tasks.named('clean') {
    dependsOn cleanJar
}
